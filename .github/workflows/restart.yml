Name: Auto Restart Hugging Face Spaces

on:
  schedule:
    # 47 மணிநேரத்திற்கு ஒருமுறை துல்லியமாக இயங்கும் (எப்போதும் அதிகாலை 3:30 - 4:30 AM நேரத்தில் ரீஸ்டார்ட் ஆகாது)
    - cron: '0 */47 * * *'
  workflow_dispatch:

jobs:
  restart-space:
    runs-on: ubuntu-latest
    steps:
      - name: Restart Movie Bot Space
        run: |
          curl -X POST https://huggingface.co/api/spaces/Feros2342/my-movie-bot-24x7/restart \
               -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}"

      - name: Restart UID Bot Space
        run: |
          curl -X POST https://huggingface.co/api/spaces/Feros2342/uidbot-space/restart \
               -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}"

      - name: Restart WA Bridge Space
        run: |
          curl -X POST https://huggingface.co/api/spaces/Feros2342/feros-wa-bridge/restart \
               -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}"
