name: Auto Restart Hugging Face Account 2

on:
  schedule:
    # சரியாக 47 மணிநேரத்திற்கு ஒருமுறை இயங்கும்
    - cron: '0 */47 * * *'
  workflow_dispatch:

jobs:
  restart-acc2-space:
    runs-on: ubuntu-latest
    steps:
      - name: Restart Second Account Movie Bot Space
        run: |
          curl -s -L -X POST https://huggingface.co/api/spaces/feros-stream-bot/MY-Movie-bot/restart \
               -H "Authorization: Bearer ${{ secrets.HF_TOKEN_2 }}"
