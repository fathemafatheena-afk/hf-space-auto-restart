name: Keep Repository Active

on:
  schedule:
    # ஒவ்வொரு மாதமும் 1-ம் தேதி இயங்கி ரெபோவை எப்போதும் ஆக்டிவாக வைத்திருக்கும்
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update keepalive file
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          echo "Last kept alive on: $(date)" > keepalive.txt
          git add keepalive.txt
          git commit -m "Automated keepalive commit [skip ci]" || exit 0
          git push
